<div class="feedback-container">
  <div class="comment-container">
    <div class="comment-section">
      <div class="comment">
        <p>
          {{ 'feedback.comment.text' | translate }}
        </p>
        <div class="author">
            <img src="./assets/img/commentline.png" alt="">
            <p>{{ 'feedback.comment.author' | translate }}</p>
        </div>
      </div>
      <img src="./assets/img/usercomment.png" alt="" />
    </div>
    <div class="arrows-container">
        <div class="leftarrow"></div>
        <img  class="dot" src="./assets/img/aktiv-slide-dot.png" alt="">
        <img class="dot" src="./assets/img/slide-dot.png" alt="">
        <img class="dot" src="./assets/img/slide-dot.png" alt="">
        <img class="rightarrow" src="./assets/img/rightarrow.png" alt="">
    </div>
  </div>
  <img src="./assets/img/comment.png" alt="">
</div>
