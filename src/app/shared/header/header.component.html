<div class="header-container">
  <div class="header-section">
    <img src="./assets/img/header-logo.png" alt="" />
    <div>
      <a
        [routerLink]="['/']"
        class="navbar-link"
        href="javascript:void(0)"
        (click)="navigateAndScroll('aboutMe')"
      >
        {{ "header.aboutMe" | translate }}
      </a>
      <a
        [routerLink]="['/']"
        class="navbar-link"
        href="javascript:void(0)"
        (click)="navigateAndScroll('skills')"
        >{{ "header.skills" | translate }}</a
      >
      <a
        [routerLink]="['/']"
        class="navbar-link"
        href="javascript:void(0)"
        (click)="navigateAndScroll('portfolio')"
        >{{ "header.portfolio" | translate }}</a
      >
      <a
        [routerLink]="['/']"
        class="navbar-link"
        href="javascript:void(0)"
        (click)="navigateAndScroll('contact')"
        >{{ "header.contact" | translate }}</a
      >
      <div class="toggle-container" (click)="toggleLanguage()">
        <div class="toggle-button" [class.active]="language === 'EN'">
          {{ language }}
        </div>
      </div>

      <div
        (click)="showMenu()"
        class="burger-menu-icon"
        [class.open]="isMenuOpen"
      >
        <span class="burger-line"></span>
        <span class="burger-line"></span>
        <span class="burger-line"></span>
      </div>
    </div>
  </div>
</div>

<div class="mobile-menu" #mobileMenu>
  <div>
    <a
      class=""
      href="javascript:void(0)"
      (click)="scrollToElement('aboutMe', 100); closeMenu()"
      >{{ "header.aboutMe" | translate }}</a
    >
    <a
      class=""
      href="javascript:void(0)"
      (click)="scrollToElement('skills', 100); closeMenu()"
      >{{ "header.skills" | translate }}</a
    >
    <a
      class=""
      href="javascript:void(0)"
      (click)="scrollToElement('portfolio', 100); closeMenu()"
      >{{ "header.portfolio" | translate }}</a
    >
    <a
      class=""
      href="javascript:void(0)"
      (click)="scrollToElement('contact', 100); closeMenu()"
      >{{ "header.contact" | translate }}</a
    >
  </div>
</div>
